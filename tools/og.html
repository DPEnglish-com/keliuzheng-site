<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 分享卡模板：1200×630。由 tools/make-assets.sh 用 headless Chrome 截图成 assets/og.png。
     色板取自 PaperEcho 的 INK：纸面、焦墨、单一朱红；直角、细线、零投影。 -->
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    background: #F4F1EA; color: #0A0A0A;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px 56px; box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "Songti SC", "Source Han Serif SC", "Noto Serif SC", serif; }
  .mono  { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  .top { display: flex; align-items: center; gap: 18px; }
  .seal {
    position: relative; width: 56px; height: 56px; background: #C0432A;
    color: #F4F1EA; display: grid; place-items: center;
    font-family: "Songti SC", "Source Han Serif SC", serif; font-size: 34px; line-height: 1;
  }
  .seal::before { content: ""; position: absolute; inset: 5px; border: 1px solid currentColor; opacity: .48; }
  .brand-name { font-family: "Songti SC", "Source Han Serif SC", serif; font-size: 26px; line-height: 1.2; letter-spacing: .04em; }
  .brand-sub { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; letter-spacing: .16em; color: #68625A; margin-top: 5px; }

  h1 { font-family: "Songti SC", "Source Han Serif SC", serif; font-weight: 400;
       font-size: 74px; line-height: 1.14; letter-spacing: -.01em; margin: 0; }
  h1 .dot { color: #C0432A; }
  .sub { font-size: 20px; line-height: 1.75; color: #4A4A48; margin-top: 20px; max-width: 30em; }

  .rule { border-top: 1px solid rgba(10, 10, 10, .30); position: relative; padding-top: 3px; margin-bottom: 14px; }
  .rule::before { content: ""; position: absolute; inset: 3px 0 auto 0; border-top: 1px solid rgba(10, 10, 10, .14); }
  .meta { display: flex; justify-content: space-between;
          font-family: ui-monospace, "SF Mono", monospace; font-size: 12px;
          letter-spacing: .08em; color: #68625A; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="top">
    <span class="seal">课</span>
    <div>
      <div class="brand-name">课蒸馏</div>
      <div class="brand-sub">COURSEDISTILL</div>
    </div>
  </div>

  <div>
    <h1>看过的课，<br>留在纸上<span class="dot">。</span></h1>
    <p class="sub">贴一条链接，把一门网课整理成讲义。<br>一讲六栏，每条都带时间码。</p>
  </div>

  <div class="bottom">
    <div class="rule"></div>
    <div class="meta">
      <span>ANDROID · 0.3.0 · 13.2 MB</span>
      <span>dpenglish-com.github.io/keliuzheng-site</span>
    </div>
  </div>
</body>
</html>
